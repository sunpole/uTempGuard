name: Publish uTempGuard v0.2.0
on:
  push:
    branches: [main]
    paths:
      - '.release/v0.2.0.md'
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-selection and live action guards
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('Test-Core.ps1','Test-Sensor.ps1','Test-ActionGuards.ps1','Test-TemperatureSources.ps1','Test-Overlay.ps1','Test-OverlayDisplay.ps1')) {
            & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests' $test)
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the single requested source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists. No duplicate release."
            exit 0
          fi
          gh release create v0.2.0 \
            --target "$GITHUB_SHA" \
            --title "uTempGuard v0.2.0 — выбор источников температуры" \
            --notes-file .release/v0.2.0.md \
            --latest
